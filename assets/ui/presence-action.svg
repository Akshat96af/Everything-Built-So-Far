<svg xmlns="http://www.w3.org/2000/svg" width="144" height="42" viewBox="0 0 144 42" role="img"><title>View live</title>
<defs><linearGradient id="surface" x2="0" y2="1"><stop stop-color="#242537"/><stop offset="1" stop-color="#0D101B"/></linearGradient><linearGradient id="sheen"><stop stop-color="#52C79B" stop-opacity="0"/><stop offset=".5" stop-color="#52C79B" stop-opacity=".24"/><stop offset="1" stop-color="#52C79B" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect x="1" y="1" width="142" height="40" rx="10"/></clipPath></defs>
<style>@keyframes sweep{0%,15%{transform:translateX(-70px)}65%,100%{transform:translateX(214px)}}@keyframes edge{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.85}}@keyframes arrow{0%,70%,100%{transform:translate(0,0)}82%{transform:translate(2px,-2px)}}.sweep{animation:sweep 6s ease-in-out infinite}.edge{animation:edge 6s ease-in-out infinite}.arrow{animation:arrow 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
